<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nightfall Protocol</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1220'/%3E%3Cpath d='M16 5l9 22-9-5-9 5z' fill='%23ffb23e'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="hud" class="hidden">
      <div id="grade"></div>
      <div id="vignette"></div>
      <div id="scope"></div>
      <div id="objectives"></div>
      <canvas id="minimap" width="190" height="190"></canvas>
      <canvas id="racemap" width="210" height="210"></canvas>
      <div id="alarm">ALARM</div>
      <div id="detect"><div id="detectLabel">HIDDEN</div><div class="bar"><i id="detectBar"></i></div></div>
      <div id="timer"></div>
      <div id="banner"><div id="bannerTitle"></div><div id="bannerSub"></div></div>
      <div id="big"></div>
      <div id="cross"><i></i><i></i><i></i><i></i></div>
      <div id="hitmark"></div>
      <div id="etags"></div>
      <div id="marker"><div class="dot"></div><span id="markerText"></span></div>
      <div id="prompt"></div>
      <div id="radio"><b id="radioWho"></b><span id="radioText"></span></div>
      <div id="status">
        <div class="stat"><label>HEALTH</label><div class="bar hp"><i id="hpBar"></i></div></div>
        <div class="stat"><label>ARMOUR</label><div class="bar ar"><i id="arBar"></i></div></div>
        <div id="stance"></div>
      </div>
      <div id="weapon"><div id="wName"></div><div id="wAmmo"></div><div id="wExtra"></div><div id="wPack"></div></div>
      <div id="vehicle"></div>
      <div id="keys"></div>
      <div id="hint">K - keys · H - manual · TAB - objectives · ESC - pause</div>
    </div>

    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
